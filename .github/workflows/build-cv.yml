name: Build CV

on:
  push:
    paths:
      - "data/cv.json"
      - "data/papers.json"
      - "data/teaching.json"
      - "scripts/build_cv.py"
      - "requirements-cv.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CV font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-texgyre

      - name: Install CV dependencies
        run: python -m pip install -r requirements-cv.txt

      - name: Build CV PDF
        run: python scripts/build_cv.py

      - name: Commit updated CV
        run: |
          if git diff --quiet -- files/Espinoza_CV.pdf files/Espinoza_CV_current.pdf; then
            echo "CV PDF is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add files/Espinoza_CV.pdf files/Espinoza_CV_current.pdf
            git commit -m "Build CV PDF"
            git push
          fi
